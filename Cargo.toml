[package]
name = "yinsh"
version = "0.1.0"
authors = ["David Peter <mail@david-peter.de>"]
description = "An implementation of the abstract board game Yinsh."
homepage = "https://david-peter.de/yinsh"
repository = "https://github.com/sharkdp/yinsh"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17" }
bevy_tweening = "0.14"
bevy_async_task = "0.11"

minimax = "0.5.3"

itertools = "0.14.0"
serde = "1.0.204"
serde_yaml = "0.9.34"
tracing = "0.1"

# separate lib and app:
[[bin]]
name = "yinsh"
path = "src/main.rs"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"

[dev-dependencies]
criterion = "0.3"
rayon = "1.10.0"
rand = "0.8.5"

[[bench]]
name = "board"
harness = false
