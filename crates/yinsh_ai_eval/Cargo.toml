[package]
name = "yinsh_ai_eval"
version = "0.1.0"
authors = ["David Peter <mail@david-peter.de>"]
description = "AI evaluation and tournament runner for the abstract board game Yinsh."
homepage = "https://david-peter.de/yinsh"
repository = "https://github.com/sharkdp/yinsh"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
yinsh = { path = "../yinsh" }
yinsh_ai = { path = "../yinsh_ai" }
rayon = "1.10.0"
rand = "0.8.5"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"

[[bin]]
name = "yinsh-ai-eval"
path = "src/main.rs"
