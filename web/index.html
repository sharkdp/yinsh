<!doctype html>
<html lang="en">

<head>
  <style type="text/css">
    html,
    body {
      margin: 0px;
      height: 100%;
      background-color: hsl(0, 0%, 5%);
    }

    #container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #yinsh-canvas {
      border: 0;
    }
  </style>
</head>

<body>
  <div id="container">
    <canvas id="yinsh-canvas" width="800" height="800"></canvas>
  </div>
  <script type="module">
    import init from './yinsh.js'

    init().catch((error) => {
      if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
        throw error;
      }
    });
  </script>
</body>

</html>
